# container_name을 고정하지 않는다. 고정하면 이름이 호스트 전역에서 유일해야 해
# 같은 머신에서 두 번째 인스턴스를 띄울 수 없다 (포트를 바꿔도 이름 충돌로 실패).
# compose가 <프로젝트명>-<서비스명>-N으로 자동 생성하며 프로젝트(디렉터리)별로 격리된다.
services:
  # 16으로 고정 — 마이너 버전이 올라가며 동작이 달라지는 것을 막는다 (채점 환경 재현성)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopdb}
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shoppw}
    # 호스트 포트를 5433으로 내보낸다. 개발 머신에 이미 PostgreSQL이 5432를 쓰고 있으면
    # Docker는 와일드카드(*:5432)로 바인딩에 "성공"하지만 localhost:5432는 기존 로컬 DB로 가버린다.
    # 컨테이너 내부와 docker 프로파일은 그대로 5432를 쓴다 (JOURNAL.md 2026-08-06 참조)
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # app이 "포트 열림"이 아니라 "쿼리 가능" 상태를 기다리게 한다.
    # depends_on만으로는 컨테이너 시작 시점까지만 보장돼 초기화 중인 DB에 붙는다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shop} -d ${POSTGRES_DB:-shopdb}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # 컨테이너 네트워크 안에서는 서비스명이 곧 호스트명이다 (localhost 아님)
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shopdb}
      DB_USERNAME: ${POSTGRES_USER:-shop}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-shoppw}
      # 애플리케이션은 "시크릿 없으면 못 뜬다"는 계약을 지키고,
      # 개발 편의는 실행 환경(여기)이 책임진다 — docker compose up 한 줄 실행이 유지된다
      JWT_SECRET: ${JWT_SECRET:-dev-only-do-not-use-in-production-0123456789}
    ports:
      - "${SERVER_PORT:-8080}:8080"

    # graceful shutdown이 끝날 시간을 준다. 애플리케이션의
    # spring.lifecycle.timeout-per-shutdown-phase(20s)보다 커야 한다 —
    # 작으면 컨테이너가 먼저 죽어 graceful 설정이 무의미해진다
    stop_grace_period: 30s

    # 컨테이너 자체의 상태. Dockerfile의 HEALTHCHECK가 readiness를 확인한다
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

volumes:
  postgres-data:
