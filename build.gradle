plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'jacoco'
}

group = 'com.sk.skala'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Spring Security 전체가 아니라 암호화 모듈만 — 필터 체인·인증 인프라는 쓰지 않는다
    implementation 'org.springframework.security:spring-security-crypto'

    // API 문서. 채점자가 Postman 없이 브라우저에서 바로 호출할 수 있어야 한다 (DECISIONS.md 19절)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // API 로깅 AOP. 프록시 기반이라 자기 호출(self-invocation)에는 걸리지 않는다
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // health/readiness/liveness. 노출은 최소화한다 (DECISIONS.md 21절)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // jjwt 0.12.x는 api/impl/jackson 3분할 — 구현체는 런타임에만 필요해 컴파일 의존성 오염을 막는다
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 테스트도 운영과 같은 PostgreSQL에서 돌린다 — 임베디드 DB로 대체하면 방언 차이를 못 잡는다
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'

    // 계층·도메인 경계를 문서가 아니라 테스트로 강제한다.
    // 문서에 써두고 스스로 어긴 사례가 이미 둘 있다 (DECISIONS.md 15절)
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

tasks.named('test') {
    // Testcontainers가 쓰는 docker-java는 Docker API를 기본 v1.32로 요청하는데,
    // Docker Engine 29가 이 버전을 거부해(400) 컨테이너가 아예 뜨지 못했다.
    //   확인: curl --unix-socket /var/run/docker.sock .../v1.32/info → 400, /v1.41/info → 200
    // 환경변수 DOCKER_API_VERSION은 docker-java가 읽지 않는다 — 프로퍼티 이름이 api.version이다.
    // Testcontainers 버전을 올려도(1.21.3까지 확인) 기본값은 그대로라 해결되지 않는다.
    // 1.44는 Docker 25(2024)부터 지원한다 (JOURNAL 2026-08-07)
    systemProperty 'api.version', '1.44'

    useJUnitPlatform()
    finalizedBy tasks.jacocoTestReport
}

// 커버리지 집계에서 제외하는 것들 — 제외 사유를 여기에 남긴다.
// (Lombok 생성 메서드는 lombok.config의 addLombokGeneratedAnnotation으로 이미 빠진다)
def jacocoExcludes = [
        // 부트스트랩. main() 한 줄이며 검증할 분기가 없다
        'com/sk/skala/shopapi/ShopApiApplication.class',
        // 설정 클래스. @Bean 정의를 테스트하는 것은 스프링을 테스트하는 것이다.
        // 이 설정들이 실제로 동작하는지는 통합 테스트(E2E·@WebMvcTest)가 검증한다
        'com/sk/skala/shopapi/global/config/**',
        // 요청/응답 DTO. Lombok 생성분을 빼고 나면 남는 것이 거의 없고,
        // 필드 존재 여부(비밀번호 미노출 등)는 Controller 테스트가 JSON으로 단언한다
        'com/sk/skala/shopapi/**/dto/**',
]

tasks.named('jacocoTestReport') {
    dependsOn tasks.test
    // classDirectories를 직접 지정하면서 compileJava와의 암묵 의존이 끊긴다.
    // 명시하지 않으면 ./gradlew build -x test 같은 조합에서 태스크 순서 경고로 빌드가 실패한다
    dependsOn tasks.compileJava
    reports {
        csv.required = true
        xml.required = true
    }
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs.collect {
        fileTree(dir: it, exclude: jacocoExcludes)
    }))
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.jacocoTestReport
    dependsOn tasks.compileJava
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs.collect {
        fileTree(dir: it, exclude: jacocoExcludes)
    }))
    violationRules {
        rule {
            // 임계치의 근거는 DECISIONS.md 16절.
            // 요약 — 목표치가 아니라 '지금 수준에서 내려가지 않게 하는 바닥'이다.
            // 측정 시점 실측(제외 적용 후)보다 낮게 잡아 정상적인 리팩터링이 게이트에
            // 걸리지 않게 하되, 검증 없는 코드가 새로 들어오면 걸리도록 한다
            limit {
                counter = 'LINE'
                minimum = 0.85
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.80
            }
        }
    }
}

// build가 커버리지 게이트를 지나가게 한다. 리포트만 만들고 아무도 안 보면 게이트가 아니다
tasks.named('check') {
    dependsOn tasks.jacocoTestCoverageVerification
}
