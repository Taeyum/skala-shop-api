plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'jacoco'
}

group = 'com.sk.skala'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Spring Security 전체가 아니라 암호화 모듈만 — 필터 체인·인증 인프라는 쓰지 않는다
    implementation 'org.springframework.security:spring-security-crypto'

    // jjwt 0.12.x는 api/impl/jackson 3분할 — 구현체는 런타임에만 필요해 컴파일 의존성 오염을 막는다
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 테스트도 운영과 같은 PostgreSQL에서 돌린다 — 임베디드 DB로 대체하면 방언 차이를 못 잡는다
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'

    // 계층·도메인 경계를 문서가 아니라 테스트로 강제한다.
    // 문서에 써두고 스스로 어긴 사례가 이미 둘 있다 (DECISIONS.md 15절)
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

tasks.named('test') {
    // Testcontainers가 쓰는 docker-java는 Docker API를 기본 v1.32로 요청하는데,
    // Docker Engine 29가 이 버전을 거부해(400) 컨테이너가 아예 뜨지 못했다.
    //   확인: curl --unix-socket /var/run/docker.sock .../v1.32/info → 400, /v1.41/info → 200
    // 환경변수 DOCKER_API_VERSION은 docker-java가 읽지 않는다 — 프로퍼티 이름이 api.version이다.
    // Testcontainers 버전을 올려도(1.21.3까지 확인) 기본값은 그대로라 해결되지 않는다.
    // 1.44는 Docker 25(2024)부터 지원한다 (JOURNAL 2026-08-07)
    systemProperty 'api.version', '1.44'

    useJUnitPlatform()
    finalizedBy tasks.jacocoTestReport
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.test
    reports { csv.required = true }
}
