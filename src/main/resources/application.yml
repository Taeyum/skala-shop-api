spring:
  application:
    name: skala-shop-api

  datasource:
    url: jdbc:h2:mem:shopdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    # data.sql이 Hibernate 스키마 생성 이후에 실행되도록 — 없으면 테이블 없이 INSERT가 먼저 돌아 실패한다
    defer-datasource-initialization: true
    # 지연 로딩을 트랜잭션 밖(뷰 렌더링 시점)으로 새어나가지 않게 한다
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      encoding: UTF-8

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
