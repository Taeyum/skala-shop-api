spring:
  application:
    name: skala-shop-api

  # 프로파일 미지정 실행(./gradlew bootRun)은 로컬 개발로 간주한다
  profiles:
    default: local

  jpa:
    hibernate:
      # Phase 0은 스키마가 계속 바뀌므로 create. 스키마 확정 후 validate 전환을 검토한다.
      # update는 컬럼 삭제·타입 변경을 조용히 무시해 스키마 드리프트를 만들므로 쓰지 않는다
      ddl-auto: create
    # data.sql이 Hibernate 스키마 생성 이후에 실행되도록 — 없으면 테이블 없이 INSERT가 먼저 돌아 실패한다
    defer-datasource-initialization: true
    # 지연 로딩을 트랜잭션 밖(뷰 렌더링 시점)으로 새어나가지 않게 한다
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      encoding: UTF-8

jwt:
  # Phase 0 기준점 — 시크릿이 저장소에 그대로 있다.
  # 환경변수 주입·만료시간 조정·쿠키 플래그(HttpOnly/Secure/SameSite)는 Phase 2 JWT 하드닝에서 처리한다
  secret: skala-shop-api-phase0-plaintext-secret-key
  expiration-ms: 3600000

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.hibernate.SQL: debug

# HikariCP 풀 크기는 의도적으로 기본값을 쓴다 — 근거 없는 숫자를 넣지 않는다.
# Phase 3에서 k6 부하 측정 결과와 함께 조정한다 (PLAN.md Phase 3)
