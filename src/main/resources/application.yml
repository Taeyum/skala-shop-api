spring:
  application:
    name: skala-shop-api

  # 프로파일 미지정 실행(./gradlew bootRun)은 로컬 개발로 간주한다
  profiles:
    default: local

  jpa:
    hibernate:
      # Phase 0은 스키마가 계속 바뀌므로 create. 스키마 확정 후 validate 전환을 검토한다.
      # update는 컬럼 삭제·타입 변경을 조용히 무시해 스키마 드리프트를 만들므로 쓰지 않는다
      ddl-auto: create
    # data.sql이 Hibernate 스키마 생성 이후에 실행되도록 — 없으면 테이블 없이 INSERT가 먼저 돌아 실패한다
    defer-datasource-initialization: true
    # 지연 로딩을 트랜잭션 밖(뷰 렌더링 시점)으로 새어나가지 않게 한다
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      encoding: UTF-8

  datasource:
    hikari:
      # 풀 크기 — Phase 6에서 곡선을 그려 정한다. 환경변수로 여는 이유는 스윕 측정 때문이다
      # (docs/perf/sweep.sh). 근거는 DECISIONS.md 24절
      maximum-pool-size: ${DB_POOL_SIZE:10}

  lifecycle:
    # graceful shutdown이 이 시간 안에 안 끝나면 강제 종료한다.
    # 이 API의 요청은 모두 짧아 20초면 충분하고, 길게 잡으면 배포가 그만큼 느려진다.
    # Kubernetes를 쓴다면 terminationGracePeriodSeconds를 이 값보다 크게 잡아야
    # 컨테이너가 먼저 죽어 graceful이 무의미해지지 않는다
    timeout-per-shutdown-phase: 20s

jwt:
  # secret은 여기 두지 않는다 — 프로파일별로 정의한다.
  #   docker : ${JWT_SECRET} 필수. 없으면 기동 실패 (fail-fast)
  #   local  : 개발 전용 기본값 허용
  # 만료 시간은 비밀이 아니므로 공통에 둔다.
  # 1시간 — 학습 프로젝트 기준값이다. 리프레시 토큰이 없어 만료되면 재로그인해야 하므로
  # 너무 짧으면 쓰기 불편하고, 길면 탈취 시 노출 창이 커진다. 그 절충점이다.
  # 실무라면 액세스 토큰을 5~15분으로 짧게 두고 리프레시 토큰을 분리한다 (DECISIONS.md 9-2절)
  expiration-ms: 3600000

  cookie:
    # Strict — 이 API에서 인증이 필요한 요청은 전부 POST(/order·/cancel)와 PUT·DELETE다.
    # 외부 링크를 타고 들어오는 GET에 쿠키가 실릴 필요가 없으므로 Lax로 완화할 이유가 없다
    same-site: Strict

    # Secure는 프로파일이 아니라 '전송 계층이 HTTPS인가'가 결정하므로 프로파일로 나누지 않는다.
    # local도 docker도 현재 HTTP로 서비스하며, 여기서 true로 켜면 브라우저·Postman이
    # 쿠키를 아예 보내지 않아 로그인이 동작하지 않는다.
    # TLS 종단(리버스 프록시 등) 뒤에 두는 순간 COOKIE_SECURE=true로 켠다 (DECISIONS.md 9-2절)
    secure: ${COOKIE_SECURE:false}

server:
  port: ${SERVER_PORT:8080}

  tomcat:
    threads:
      # 워커 스레드 수 — 마찬가지로 Phase 6에서 측정 후 정한다
      max: ${TOMCAT_MAX_THREADS:200}

  # 종료 신호를 받으면 새 요청은 거절하되 처리 중인 요청은 끝까지 마친다.
  # 없으면 배포·스케일인 때 진행 중이던 주문이 중간에 끊긴다 —
  # 결제는 됐는데 OrderItem이 안 생기는 식의 정합성 문제가 아니라,
  # 트랜잭션은 롤백되지만 클라이언트가 결과를 모르는 상태가 된다
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # ★ 화이트리스트다. include: "*" 로 열면 env·configprops가 함께 열리고
        # 거기에 JWT_SECRET·DB 비밀번호가 그대로 보인다 — Phase 2에서 막은 것과 같은 자산이다.
        # heapdump는 힙 전체(비밀번호 평문·토큰 포함)를 파일로 내려준다.
        # 필요한 것만 이름으로 적는다 (DECISIONS.md 21절)
        include: health
  endpoint:
    health:
      # readiness/liveness 그룹을 쓰려면 켜야 한다. 상세 정보는 아래에서 제한한다
      probes:
        enabled: true
      # 컴포넌트별 상세(DB 접속 URL·드라이버·디스크 경로)는 내보내지 않는다.
      # 상태만 알면 되고, 상세는 내부 정보다
      show-details: never
      show-components: never
  health:
    # /actuator/health/readiness · /actuator/health/liveness
    #   liveness  — 프로세스가 살아 있는가. 실패하면 재시작해야 한다
    #   readiness — 트래픽을 받을 준비가 됐는가(DB 연결 포함). 실패하면 LB에서 빼면 된다
    # 둘을 구분하지 않으면 DB가 잠깐 끊겼을 때 멀쩡한 프로세스를 재시작하게 된다
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  # 노출 여부를 스위치로 둔다. 이 프로젝트에서는 켠 채로 제출한다 —
  # 채점자가 브라우저만으로 전체 API를 호출할 수 있어야 하고, 그것이 산출물의 일부다.
  # 실서비스라면 끄거나 내부망에만 여는 것이 맞다: 문서는 곧 공격 표면의 지도이고,
  # 엔드포인트·파라미터·에러 코드가 한 화면에 정리돼 나간다 (DECISIONS.md 19절)
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    # 채점자가 외우기 쉬운 경로. 기본값 /swagger-ui/index.html 에서 리다이렉트된다
    path: /swagger-ui.html
    # 태그·엔드포인트를 알파벳순으로 고정한다 — 재기동마다 순서가 바뀌면 문서를 신뢰하기 어렵다
    tags-sorter: alpha
    operations-sorter: method

logging:
  # traceId를 모든 로그 줄에 붙인다. 동시 요청이 섞여도 한 요청의 로그를 모을 수 있다.
  # MDC에 값이 없으면(스케줄러·기동 로그) 빈 문자열이 되도록 기본값을 준다
  pattern:
    level: "%5p [%X{traceId:-}]"

  level:
    # 실행되는 SQL 자체. N+1은 "쿼리가 몇 번 나갔는가"의 문제라 이 로그가 유일한 1차 증거다.
    # format_sql: true 와 함께 봐야 읽힌다 (Phase 3 개선 전/후 캡처 → docs/evidence/)
    org.hibernate.SQL: debug

    # 바인딩 파라미터(? 자리의 실제 값). 기본은 끈다 —
    # customers INSERT/UPDATE의 파라미터에 비밀번호 해시가 그대로 찍힌다.
    # N+1 추적에서 "어떤 product_id를 몇 번 조회했는가"까지 봐야 할 때만 일시적으로 켠다
    # org.hibernate.orm.jdbc.bind: trace
    # ResponseException의 맥락 메시지("Customer not found")는 응답에 싣지 않고 로그로만 남긴다.
    # 기본 INFO 레벨이면 그 debug 로그가 출력되지 않아 메시지가 어디에도 안 남는다
    com.sk.skala.shopapi: debug


